[project]
name = "devicelab"
version = "0.1.0"
description = "Open-source control plane for automated workflows across a distributed fleet of iPhones and simulators."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Owais Munawwar" }]
dependencies = [
    "alembic>=1.20.0",
    "appium-python-client>=6.0.7",
    "asyncpg>=0.32.0",
    "boto3>=1.43.114",
    "cronsim>=2.7",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
devicelab = "devicelab.cli:main"
devicelab-agent = "devicelab.agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devicelab"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "boto3-stubs[s3]>=1.43.114",
    "hypothesis>=6.170.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "C4", "RUF", "PL", "T20", "PT"]
ignore = ["PLR0913", "PLR2004", "S101", "RUF012", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "S311", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT018", "E501", "S105", "S106", "S108", "PLC0415", "S603", "S607", "T201"]
"tests/chaos/harness.py" = ["ASYNC109"]
"scripts/**" = ["E501", "T201", "S603", "S607", "PLC0415"]
"src/devicelab/cli.py" = ["T201"]
"src/devicelab/adapters/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["appium.*", "cronsim.*", "selenium.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["chaos: kills agents and restarts the API; slower than unit tests"]
addopts = "-ra --strict-markers --timeout=120"

[tool.coverage.run]
source = ["src/devicelab"]
branch = true

[tool.coverage.report]
show_missing = true
